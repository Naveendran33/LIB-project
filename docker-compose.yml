version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: library-mysql
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-naveen}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: library-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/library_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-naveen}
      JWT_SECRET: ${JWT_SECRET:-superlongsecretstringatleast32characters}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
